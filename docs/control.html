<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PedeAi Control</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#1d2939;background:#f6f7fb}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.shell{max-width:1280px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:20px;box-shadow:0 3px 12px #1018280d}.login{max-width:420px;margin:10vh auto}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin:20px 0}.stat strong{display:block;font-size:1.8rem}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}input,select,textarea{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:8px}.toolbar input{flex:1;min-width:220px}.toolbar select{width:180px}label{display:grid;gap:6px;margin:12px 0}button{border:0;border-radius:8px;padding:10px 14px;background:#e83b17;color:#fff}button.secondary{background:#344054}button.danger{background:#b42318}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #84caff;outline-offset:2px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #eaecf0;white-space:nowrap}.badge{padding:4px 9px;border-radius:999px;background:#ecfdf3;color:#027a48}.badge.suspended{background:#fef3f2;color:#b42318}.actions{display:flex;gap:8px}.actions button{padding:6px 9px}.feedback{min-height:24px;margin:10px 0;color:#b42318}.pager{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.modal{position:fixed;inset:0;background:#10182899;display:grid;place-items:center;padding:20px}.modal .card{width:min(560px,100%);max-height:90vh;overflow:auto}@media(max-width:760px){.shell{padding:12px}.stats{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}th:nth-child(n+5),td:nth-child(n+5){display:none}}@media(max-width:430px){.stats{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="shell">
    <section id="login" class="card login" aria-labelledby="login-title">
      <h1 id="login-title">PedeAi Control</h1><p>Administração global dos restaurantes</p>
      <form id="login-form"><label>E-mail<input name="email" type="email" autocomplete="username" required></label><label>Senha<input name="password" type="password" autocomplete="current-password" required></label><button>Entrar</button></form>
      <p id="login-feedback" class="feedback" role="alert"></p>
    </section>
    <section id="app" class="hidden" aria-labelledby="page-title">
      <header class="top"><div><h1 id="page-title">Restaurantes</h1><span id="build"></span></div><div><button id="new">Novo restaurante</button> <button id="logout" class="secondary">Sair</button></div></header>
      <div class="grid stats" aria-label="Resumo"><div class="card stat"><span>Total</span><strong id="total">0</strong></div><div class="card stat"><span>Ativos</span><strong id="active">0</strong></div><div class="card stat"><span>Suspensos</span><strong id="suspended">0</strong></div><div class="card stat"><span>Página</span><strong id="page-stat">1</strong></div></div>
      <section class="card"><div class="toolbar"><input id="query" type="search" placeholder="Buscar nome, slug ou responsável" aria-label="Buscar restaurantes"><select id="status" aria-label="Filtrar por status"><option value="">Todos os status</option><option value="active">Ativos</option><option value="suspended">Suspensos</option></select></div><p id="feedback" class="feedback" role="status" aria-live="polite"></p><div class="table-wrap"><table><thead><tr><th>Restaurante</th><th>Responsável</th><th>Status</th><th>Cadastros</th><th>Último acesso</th><th>Ações</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pager"><button id="prev" class="secondary">Anterior</button><button id="next" class="secondary">Próxima</button></div></section>
    </section>
  </main>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title"><form id="restaurant-form" class="card"><h2 id="modal-title">Novo restaurante</h2><input name="id" type="hidden"><label>Nome<input name="name" required maxlength="120"></label><label>Slug<input name="slug" pattern="[a-z0-9]+(?:-[a-z0-9]+)*"></label><fieldset id="owner-fields"><legend>Responsável inicial</legend><label>Nome<input name="owner_name"></label><label>E-mail<input name="owner_email" type="email"></label><label>Senha<input name="owner_password" type="password" minlength="8"></label></fieldset><label id="reason-field" class="hidden">Motivo<textarea name="reason"></textarea></label><p id="modal-feedback" class="feedback" role="alert"></p><div class="actions"><button id="save">Salvar</button><button id="cancel" type="button" class="secondary">Cancelar</button></div></form></div>
  <script>
    const $=id=>document.getElementById(id), state={token:sessionStorage.getItem('pedeai-control-token'),page:1,total:0,mode:'create',restaurant:null,restaurants:[]};
    async function api(path,options={}){const response=await fetch('/api/internal'+path,{...options,headers:{'Content-Type':'application/json',...(state.token?{Authorization:'Bearer '+state.token}:{}),...(options.headers||{})}});const body=response.status===204?{}:await response.json().catch(()=>({}));if(!response.ok)throw Object.assign(new Error((body.messages||['Falha na operação']).join(' ')),{status:response.status,body});return body}
    function showApp(authenticated){$('login').classList.toggle('hidden',authenticated);$('app').classList.toggle('hidden',!authenticated);if(authenticated){load();diagnostics()}}
    $('login-form').onsubmit=async e=>{e.preventDefault();$('login-feedback').textContent='Entrando…';const data=new FormData(e.target);try{const body=await api('/session',{method:'POST',body:JSON.stringify({platform_user:{email:data.get('email'),password:data.get('password')}})});state.token=body.token;sessionStorage.setItem('pedeai-control-token',state.token);$('login-feedback').textContent='';showApp(true)}catch(error){$('login-feedback').textContent=error.message}}
    async function load(){const query=new URLSearchParams({page:state.page,per_page:20,query:$('query').value,status:$('status').value});$('feedback').textContent='Carregando…';try{const body=await api('/restaurants?'+query);state.total=body.meta.total;state.restaurants=body.restaurants;$('total').textContent=body.meta.total;$('active').textContent=body.meta.status_counts?.active||0;$('suspended').textContent=body.meta.status_counts?.suspended||0;$('page-stat').textContent=body.meta.page;$('rows').innerHTML=body.restaurants.length?body.restaurants.map(rowTemplate).join(''):'<tr><td colspan="6">Nenhum restaurante encontrado.</td></tr>';$('feedback').textContent='';$('prev').disabled=state.page===1;$('next').disabled=state.page*body.meta.per_page>=body.meta.total}catch(error){$('feedback').textContent=error.message;if(error.status===401)logout()}}
    function rowTemplate(r){const counts=r.counts||{};return `<tr><td><strong>${escapeHtml(r.name)}</strong><br><small>${escapeHtml(r.slug)}</small></td><td>${escapeHtml(r.owner?.name||'—')}<br><small>${escapeHtml(r.owner?.email||'')}</small></td><td><span class="badge ${r.status}">${r.status==='active'?'Ativo':'Suspenso'}</span></td><td>${counts.users||0} usuários · ${counts.products||0} produtos · ${counts.orders||0} pedidos</td><td>${r.last_access_at?new Date(r.last_access_at).toLocaleString('pt-BR'):'—'}</td><td class="actions"><button class="secondary" data-action="edit" data-id="${r.id}">Editar</button><button class="${r.status==='active'?'danger':''}" data-action="lifecycle" data-id="${r.id}">${r.status==='active'?'Suspender':'Reativar'}</button></td></tr>`}
    function escapeHtml(value){const span=document.createElement('span');span.textContent=value??'';return span.innerHTML}
    function openModal(mode,r=null){state.mode=mode;state.restaurant=r;const form=$('restaurant-form');form.reset();form.id.value=r?.id||'';form.name.value=r?.name||'';form.slug.value=r?.slug||'';$('modal-title').textContent=mode==='create'?'Novo restaurante':mode==='edit'?'Editar restaurante':mode==='suspend'?'Suspender restaurante':'Reativar restaurante';$('owner-fields').classList.toggle('hidden',mode!=='create');$('reason-field').classList.toggle('hidden',!['suspend','reactivate'].includes(mode));$('modal-feedback').textContent='';$('modal').classList.remove('hidden');form.querySelector('input:not([type=hidden])').focus()}
    $('rows').onclick=e=>{const button=e.target.closest('button[data-id]');if(!button)return;const r=state.restaurants.find(item=>item.id===Number(button.dataset.id));openModal(button.dataset.action==='edit'?'edit':r.status==='active'?'suspend':'reactivate',r)};$('new').onclick=()=>openModal('create');$('cancel').onclick=()=>$('modal').classList.add('hidden');
    $('restaurant-form').onsubmit=async e=>{e.preventDefault();const data=new FormData(e.target),restaurant={name:data.get('name'),slug:data.get('slug')||undefined};let path='/restaurants',method='POST',payload={restaurant,super_admin:{name:data.get('owner_name'),email:data.get('owner_email'),password:data.get('owner_password'),password_confirmation:data.get('owner_password')}};if(state.mode==='edit'){path+='/'+state.restaurant.id;method='PATCH';payload={restaurant:{name:restaurant.name}}}if(['suspend','reactivate'].includes(state.mode)){path+='/'+state.restaurant.id+'/'+state.mode;payload={reason:data.get('reason')}}try{await api(path,{method,body:JSON.stringify(payload)});$('modal').classList.add('hidden');await load()}catch(error){$('modal-feedback').textContent=error.message}}
    async function diagnostics(){try{const d=await api('/diagnostics');$('build').textContent=`${d.version} · ${d.commit} · ${d.built_at}`}catch(_){}}
    function logout(){state.token=null;sessionStorage.removeItem('pedeai-control-token');showApp(false)}$('logout').onclick=logout;$('prev').onclick=()=>{if(state.page>1){state.page--;load()}};$('next').onclick=()=>{state.page++;load()};let timer;$('query').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>{state.page=1;load()},250)};$('status').onchange=()=>{state.page=1;load()};showApp(!!state.token);
  </script>
</body>
</html>
