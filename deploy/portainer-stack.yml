services:
  web:
    image: ${PEDEAI_IMAGE:?PEDEAI_IMAGE is required}
    command: ["web"]
    environment:
      RAILS_ENV: production
      BUNDLE_WITHOUT: development:test
      PORT: "3000"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE is required}
      DATABASE_URL: postgres://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${HTTP_PORT:-3000}:3000"
    networks: [private]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      - db
      - redis

    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  worker:
    image: ${PEDEAI_IMAGE:?PEDEAI_IMAGE is required}
    command: ["worker"]
    environment:
      RAILS_ENV: production
      BUNDLE_WITHOUT: development:test
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE is required}
      DATABASE_URL: postgres://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      REDIS_URL: redis://redis:6379/0
      SIDEKIQ_CONCURRENCY: ${SIDEKIQ_CONCURRENCY:-5}
    networks: [private]
    restart: unless-stopped
    depends_on:
      - db
      - redis

    logging: *default-logging

  migrate:
    image: ${PEDEAI_IMAGE:?PEDEAI_IMAGE is required}
    command: ["migrate"]
    environment:
      RAILS_ENV: production
      BUNDLE_WITHOUT: development:test
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE is required}
      DATABASE_URL: postgres://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      REDIS_URL: redis://redis:6379/0
    networks: [private]
    restart: "no"
    depends_on:
      - db

    logging: *default-logging

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [private]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [private]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

networks:
  private:
    driver: bridge

volumes:
  postgres_data:
    name: pedeai_postgres_data
  redis_data:
    name: pedeai_redis_data
